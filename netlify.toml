[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Imposta qui (o nelle variabili del sito su Netlify) l'indirizzo definitivo.
  SITE_URL = "https://atlante-strumenti.netlify.app"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
